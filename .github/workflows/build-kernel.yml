name: Build Kernel

on:
  push:
    branches: [ motog57 ]
  pull_request:
    branches: [ motog57 ]
  workflow_dispatch:

jobs:
  build:
    name: Build gki_defconfig
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAKEFLAGS: "-j$(nproc) -l$(nproc)"
      KCFLAGS: "-O3 -flto=thin -fomit-frame-pointer -fno-semantic-interposition -fdata-sections -ffunction-sections -march=armv8.2-a -mtune=cortex-a78 -Wno-error=macro-redefined -Wno-error=default-const-init-field-unsafe -Wno-error=default-const-init-var-unsafe -Wno-error=uninitialized -Wno-error=frame-larger-than -Wno-error=attribute-warning"
      KCPPFLAGS: "-O3 -flto=thin -fomit-frame-pointer -fno-semantic-interposition -fdata-sections -ffunction-sections -march=armv8.2-a -mtune=cortex-a78 -Wno-error=macro-redefined -Wno-error=default-const-init-field-unsafe -Wno-error=default-const-init-var-unsafe -Wno-error=uninitialized -Wno-error=frame-larger-than -Wno-error=attribute-warning"
      LDFLAGS: "-O3 -flto=thin -Wl,--gc-sections -Wl,--icf=all -Wl,-z,now -Wl,-z,relro"
    steps:
      - name: Checkout (depth=1, no tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: motog57
          fetch-tags: false
          set-safe-directory: false

      - name: Maximize build performance
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "BUILD_START=$(date -u)" >> $GITHUB_ENV
          
          # Disable mitigations for speed
          echo "mitigations=off" | sudo tee -a /etc/default/grub >/dev/null
          sudo update-grub 2>/dev/null || true
          
          # Set CPU governor to performance
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
          
          # Disable swap for speed
          sudo swapoff -a 2>/dev/null || true

      - name: Install minimal dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            libncurses-dev dwarves pahole wget p7zip-full ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('.github/workflows/build-kernel.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('.github/workflows/build-kernel.yml') }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          ccache --max-size=4G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache -z
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=4G" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=1" >> $GITHUB_ENV

      - name: Setup Clang toolchain
        run: |
          mkdir -p toolchain && cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-23/llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260531.7z
          7z x llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260531.7z -y
          echo "CLANG_PATH=$PWD" >> "$GITHUB_ENV"

      - name: gki_defconfig
        run: make O=out/gki ARCH=arm64 gki_defconfig

      - name: Build Image
        run: |
          export PATH="${{ env.CLANG_PATH }}/bin:$PATH"
          export CC="ccache clang"
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export HOSTCC="ccache clang"
          export HOSTCXX="ccache clang++"
          export HOSTLD=ld.lld
          export AR=llvm-ar
          export AS=llvm-as
          
          # Host tools MUST NOT use LTO (they run on build host, need native ELF)
          export HOSTCFLAGS="-O2 -fno-lto"
          export HOSTCXXFLAGS="-O2 -fno-lto"
          export HOSTLDFLAGS="-O2 -fno-lto"
          
          # Target kernel: ThinLTO + optimizations
          export KBUILD_CFLAGS="${KCFLAGS}"
          export KBUILD_CPPFLAGS="${KCPPFLAGS}"
          export KBUILD_LDFLAGS="${LDFLAGS}"
          
          make O=out/gki ARCH=arm64 \
            LLVM=1 \
            KBUILD_CFLAGS="${KBUILD_CFLAGS}" \
            KBUILD_CPPFLAGS="${KBUILD_CPPFLAGS}" \
            KBUILD_LDFLAGS="${KBUILD_LDFLAGS}" \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            HOSTCXXFLAGS="${HOSTCXXFLAGS}" \
            HOSTLDFLAGS="${HOSTLDFLAGS}" \
            Image -j4

      - name: Verify Image
        run: test -f out/gki/arch/arm64/boot/Image

      - name: Build Metrics & Evaluation
        run: |
          echo "## Build Evaluation Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Kernel version
          KERNEL_VER=$(make -s O=out/gki ARCH=arm64 kernelversion 2>/dev/null || echo "unknown")
          echo "### Kernel Version: $KERNEL_VER" >> $GITHUB_STEP_SUMMARY
          
          # Build time
          BUILD_END=$(date -u)
          START_EPOCH=$(date -d "$BUILD_START" +%s)
          END_EPOCH=$(date -d "$BUILD_END" +%s)
          ELAPSED=$((END_EPOCH - START_EPOCH))
          ELAPSED_MIN=$((ELAPSED / 60))
          ELAPSED_SEC=$((ELAPSED % 60))
          echo "### Build Time" >> $GITHUB_STEP_SUMMARY
          echo "- Started: $BUILD_START" >> $GITHUB_STEP_SUMMARY
          echo "- Finished: $BUILD_END" >> $GITHUB_STEP_SUMMARY
          echo "- Elapsed: ${ELAPSED_MIN}m ${ELAPSED_SEC}s" >> $GITHUB_STEP_SUMMARY
          
          # Image size
          IMG_SIZE=$(stat -c%s out/gki/arch/arm64/boot/Image 2>/dev/null || echo 0)
          IMG_SIZE_MB=$((IMG_SIZE / 1024 / 1024))
          echo "### Output Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${IMG_SIZE_MB} MB ($IMG_SIZE bytes)" >> $GITHUB_STEP_SUMMARY
          
          # vmlinux size
          if [ -f out/gki/vmlinux ]; then
            VMLINUX_SIZE=$(stat -c%s out/gki/vmlinux)
            VMLINUX_MB=$((VMLINUX_SIZE / 1024 / 1024))
            echo "- vmlinux: ${VMLINUX_MB} MB" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Object files count
          OBJ_COUNT=$(find out/gki -name "*.o" -type f 2>/dev/null | wc -l)
          echo "- Object files: $OBJ_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Module count (.ko files)
          KO_COUNT=$(find out/gki -name "*.ko" -type f 2>/dev/null | wc -l)
          echo "- Kernel modules (.ko): $KO_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # DTB count
          DTB_COUNT=$(find out/gki/arch/arm64/boot/dts -name "*.dtb" -type f 2>/dev/null | wc -l)
          echo "- DTBs: $DTB_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Config stats
          CONFIG_OPTS=$(grep -c "^CONFIG_" out/gki/.config 2>/dev/null || echo 0)
          CONFIG_Y=$(grep -c "^CONFIG_.*=y" out/gki/.config 2>/dev/null || echo 0)
          CONFIG_M=$(grep -c "^CONFIG_.*=m" out/gki/.config 2>/dev/null || echo 0)
          CONFIG_N=$(grep -c "^# CONFIG_.* is not set" out/gki/.config 2>/dev/null || echo 0)
          echo "### Kernel Config" >> $GITHUB_STEP_SUMMARY
          echo "- Total CONFIG_ options: $CONFIG_OPTS" >> $GITHUB_STEP_SUMMARY
          echo "- Built-in (=y): $CONFIG_Y" >> $GITHUB_STEP_SUMMARY
          echo "- Modules (=m): $CONFIG_M" >> $GITHUB_STEP_SUMMARY
          echo "- Disabled: $CONFIG_N" >> $GITHUB_STEP_SUMMARY
          echo "- .config size: $(stat -c%s out/gki/.config 2>/dev/null || echo 0) bytes" >> $GITHUB_STEP_SUMMARY
          
          # ccache stats
          echo "### ccache Statistics" >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY
          
          # Compiler info
          echo "### Toolchain" >> $GITHUB_STEP_SUMMARY
          ${CLANG_PATH}/bin/clang --version | head -1 >> $GITHUB_STEP_SUMMARY
          echo "- LLVM tools: ld.lld, llvm-nm, llvm-objcopy, llvm-objdump, llvm-strip, llvm-ar, llvm-as" >> $GITHUB_STEP_SUMMARY
          
          # Build host info
          echo "### Build Environment" >> $GITHUB_STEP_SUMMARY
          echo "- CPUs: $(nproc)" >> $GITHUB_STEP_SUMMARY
          echo "- RAM: $(free -h | awk '/^Mem:/ {print $2}')" >> $GITHUB_STEP_SUMMARY
          echo "- Disk: $(df -h /home/runner | awk 'NR==2 {print $4}') free" >> $GITHUB_STEP_SUMMARY
          
          # Warning summary (from build log if available)
          echo "### Build Warnings Summary" >> $GITHUB_STEP_SUMMARY
          echo "- (Check full log for details)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-${{ github.run_number }}
          path: out/gki/arch/arm64/boot/Image
          if-no-files-found: error